name: Build Android app

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publishes the APK as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (highlight picking, layouts, settings)
        run: ./gradlew --no-daemon :core:test

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: DeadlockClipper-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Publish the APK as the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Deadlock Clipper for Android (latest build)
          body: |
            Newest build of the master branch. On your phone, open this page, download
            **app-release.apk** and open it to install (allow "install unknown apps" when asked).
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          prerelease: false
